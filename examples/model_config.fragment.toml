# 将以下内容合并到 MaiBot 的 config/model_config.toml 中

[[api_providers]]
name = "Google-Vertex-Connect"
base_url = "https://us-central1-aiplatform.googleapis.com"
api_key = "/path/to/service-account.json"  # 也可直接填写 ya29.xxx Bearer Token、AIzaSy... API Key 或留空（走本地 ADC/gcloud）
auth_type = "none"
client_type = "vertex_connect"             # 必须与插件注册的 client_type 保持一致
timeout = 120
max_retry = 2
retry_interval = 3

[[models]]
model_identifier = "gemini-2.5-flash"
name = "vertex-gemini-2.5-flash"
api_provider = "Google-Vertex-Connect"
model_type = "llm"
visual = true

[[models]]
model_identifier = "gemini-2.5-pro"
name = "vertex-gemini-2.5-pro"
api_provider = "Google-Vertex-Connect"
model_type = "llm"
visual = true

# 分配各模型任务角色
[model_task_config.replyer]
model_list = ["vertex-gemini-2.5-flash"]
temperature = 0.7
max_tokens = 4096

[model_task_config.planner]
model_list = ["vertex-gemini-2.5-pro"]
temperature = 0.3
max_tokens = 4096

[model_task_config.vlm]
model_list = ["vertex-gemini-2.5-flash"]
max_tokens = 4096

[model_task_config.voice]
model_list = ["vertex-gemini-2.5-flash"]
max_tokens = 1024
