[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertexai-maibot-connect"
version = "0.1.1"
description = "通过 Google Cloud Vertex AI 官方 SDK 为 MaiBot 提供对话、视觉理解、音频转写及嵌入的插件化 Provider"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "google-auth>=2.0.0",
]
